<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>para você</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --noite:#1A1028;
    --ameixa:#2A1B3D;
    --vela:#F7C8A0;
    --rosa:#E86A8C;
    --creme:#FFF4E4;
    --discreto:#9B87B5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--noite);color:var(--creme);
    font-family:'Karla',ui-sans-serif,system-ui,sans-serif;
    overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;
  }
  canvas{display:block;width:100%;height:100%;position:fixed;inset:0}

  #contagem{
    position:fixed;top:26px;left:0;right:0;text-align:center;
    font-size:13px;letter-spacing:.14em;color:var(--discreto);
    pointer-events:none;transition:opacity 1s ease;
  }

  #mensagem{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(76vw,440px);text-align:center;pointer-events:none;
    font-family:'Cormorant Garamond',Georgia,serif;
    font-style:italic;font-weight:300;
    font-size:clamp(26px,6vw,40px);line-height:1.25;
    color:var(--creme);text-shadow:0 0 30px rgba(232,106,140,.5);
    opacity:0;transition:opacity 1.1s ease;
  }
  #mensagem.visivel{opacity:1}

  #tela{
    position:fixed;inset:0;display:grid;place-items:center;
    background:rgba(26,16,40,.9);backdrop-filter:blur(8px);
    padding:28px;text-align:center;
    transition:opacity 1.4s ease;
  }
  #tela.oculto{opacity:0;pointer-events:none}
  .cartao{max-width:400px}
  h1{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:300;font-style:italic;
    font-size:clamp(48px,13vw,78px);line-height:1;
    color:var(--vela);
  }
  h1 span{display:block;font-style:normal;font-weight:500;color:var(--creme)}
  .carta{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:22px;line-height:1.65;color:var(--creme);
    margin-top:20px;
  }
  .sub{margin-top:20px;font-size:14px;line-height:1.7;color:var(--discreto)}
  button{
    margin-top:30px;font-family:'Karla',sans-serif;font-size:15px;
    padding:13px 32px;border:1px solid rgba(247,200,160,.45);border-radius:100px;
    background:transparent;color:var(--vela);cursor:pointer;
    transition:background .3s ease,color .3s ease;
  }
  button:hover{background:var(--vela);color:#2A1B3D}
  button:focus-visible{outline:2px solid var(--rosa);outline-offset:4px}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>

<canvas id="jogo"></canvas>
<div id="contagem"></div>
<div id="mensagem"></div>

<div id="tela">
  <div class="cartao" id="cartao"></div>
</div>

<script>

const NOME = 'Sofia';

const FRASES = [
  '"vamos virar para dormir"',
  'minha cheirosa',
  'nossos sushizinhos',
  'seus olhos verdes lindos',
  'seu sorriso perfeito',
  'todos os nossos planos',
  'te amo empatado'
];

const CARTA = 'A minha melhor amiga com certeza é o meu amor.';

const TACADAS = 10;


(() => {
  const cvs = document.getElementById('jogo');
  const ctx = cvs.getContext('2d');
  const elContagem = document.getElementById('contagem');
  const elMensagem = document.getElementById('mensagem');
  const elTela = document.getElementById('tela');
  const elCartao = document.getElementById('cartao');

  const calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TOTAL = FRASES.length;

  let W, H, cx, cy, R;
  function medir(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = cvs.clientWidth; H = cvs.clientHeight;
    cvs.width = Math.round(W*dpr); cvs.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cx = W/2; cy = H/2; R = Math.min(W,H)*0.40;
    montarConstelacao();
  }

  let nos = [];
  function montarConstelacao(){
    const antes = nos.map(n => n.aceso);
    nos = [];
    const esc = R * 0.052;
    for (let i = 0; i < TOTAL; i++){
      const t = (i / TOTAL) * Math.PI * 2 - Math.PI/2;
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
      nos.push({ x: cx + x*esc, y: cy + y*esc - R*0.04, aceso: antes[i] || false, brilho: 0 });
    }
  }

  let ac = null;
  const NOTAS = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1568];
  function tocar(freq, dur, vol, tipo){
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = tipo || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, ac.currentTime);
    g.gain.linearRampToValueAtTime(vol, ac.currentTime + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  }
  function acorde(i){
    const n = NOTAS[i % NOTAS.length];
    tocar(n, 1.4, .10);
    setTimeout(() => tocar(n * 1.5, 1.6, .05), 90);
  }
  function abrirAudio(){ if (!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } }

  const S = { INICIO:0, JOGANDO:1, FINAL:2 };
  let estado = S.INICIO;
  let acesas = 0, rebatidas = 0, lento = 1;

  const arco = { ang:-Math.PI/2, alvo:-Math.PI/2, meia:0.46, vel:0 };
  const luz = { x:0, y:0, vx:0, vy:0, r:8, rastro:[] };
  let faiscas = [], poeira = [], estrela = null;

  function veloc(){ return Math.min(250 + rebatidas*7, 480) * lento; }

  function soltar(){
    const a = Math.random()*Math.PI*2;
    luz.x = cx; luz.y = cy;
    luz.vx = Math.cos(a)*veloc(); luz.vy = Math.sin(a)*veloc();
    luz.rastro.length = 0;
  }

  function novaEstrela(){
    const a = Math.random()*Math.PI*2;
    const d = R*0.25 + Math.random()*R*0.45;
    return { x: cx+Math.cos(a)*d, y: cy+Math.sin(a)*d, giro:0, nascendo:0, restantes:TACADAS };
  }

  function iniciar(){
    abrirAudio();
    acesas = 0; rebatidas = 0; lento = 1;
    faiscas = []; nos.forEach(n => { n.aceso = false; n.brilho = 0; });
    estrela = novaEstrela();
    soltar();
    estado = S.JOGANDO;
    elTela.classList.add('oculto');
    elContagem.style.opacity = 1;
    atualizarContagem();
  }

  function atualizarContagem(){
    elContagem.textContent = `${acesas} de ${TOTAL}`;
  }

  let tempoMensagem = 0;
  function mostrarFrase(txt){
    elMensagem.textContent = txt;
    elMensagem.classList.add('visivel');
    tempoMensagem = 4.2;
  }

  function telaInicial(){
    elCartao.innerHTML = `<h1>para o meu amor!</h1>
      <p class="sub">Gire o arco com o mouse ou o dedo para não deixar a luz escapar.<br>Cada estrela que ela toca acende uma parte do céu.</p>
      <button id="b">Acender a primeira</button>`;
    document.getElementById('b').addEventListener('click', iniciar);
  }

  function final(){
    estado = S.FINAL;
    elContagem.style.opacity = 0;
    elMensagem.classList.remove('visivel');
    setTimeout(() => {
      elCartao.innerHTML = `<p class="carta">${CARTA}</p>
        <button id="b">Ver de novo</button>`;
      elTela.classList.remove('oculto');
      document.getElementById('b').addEventListener('click', iniciar);
    }, 2600);
  }

  const mirar = (px,py) => { arco.alvo = Math.atan2(py-cy, px-cx); };
  addEventListener('pointermove', e => mirar(e.clientX, e.clientY), {passive:true});
  addEventListener('pointerdown', e => { abrirAudio(); mirar(e.clientX, e.clientY); }, {passive:true});
  addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') arco.alvo -= 0.2;
    if (e.key === 'ArrowRight') arco.alvo += 0.2;
  });

  const dif = (a,b) => { let d=(a-b+Math.PI)%(Math.PI*2); if(d<0)d+=Math.PI*2; return d-Math.PI; };

  function brilhar(x,y,cor,qtd,forca){
    if (calmo) qtd = Math.min(qtd,5);
    for (let i=0;i<qtd;i++){
      const a = Math.random()*Math.PI*2, v = forca*(0.25+Math.random()*0.75);
      faiscas.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,vida:1,cor,tam:.8+Math.random()*2.2});
    }
  }

  for (let i=0;i<46;i++){
    poeira.push({ x:Math.random(), y:Math.random(), v:0.006+Math.random()*0.016,
                  tam:0.5+Math.random()*1.4, fase:Math.random()*Math.PI*2 });
  }

  function resolver(pegou){
    const no = nos[acesas];
    if (no){ no.aceso = true; brilhar(no.x, no.y, '#FFF4E4', pegou?26:14, 90); }
    if (estrela) brilhar(estrela.x, estrela.y, pegou?'#F7C8A0':'#E86A8C', pegou?24:16, pegou?190:100);

    if (pegou) acorde(acesas);
    else tocar(NOTAS[acesas % NOTAS.length], 2.0, .06);

    mostrarFrase(FRASES[acesas]);
    acesas++;
    atualizarContagem();
    estrela = null;

    if (acesas >= TOTAL) final();
    else setTimeout(() => { if (estado === S.JOGANDO) estrela = novaEstrela(); }, 900);
  }

  function passo(dt, t){
    const antes = arco.ang;
    arco.ang += dif(arco.alvo, arco.ang) * Math.min(1, dt*15);
    arco.vel = dif(arco.ang, antes)/Math.max(dt,.001);

    for (const p of poeira){
      p.y -= p.v*dt;
      if (p.y < -0.02){ p.y = 1.02; p.x = Math.random(); }
    }

    if (tempoMensagem > 0){
      tempoMensagem -= dt;
      if (tempoMensagem <= 0) elMensagem.classList.remove('visivel');
    }

    for (const n of nos) if (n.aceso && n.brilho < 1) n.brilho = Math.min(1, n.brilho + dt*1.6);

    if (estado === S.FINAL) lento = Math.max(0, lento - dt*0.5);

    if (estado === S.JOGANDO || estado === S.FINAL){
      luz.x += luz.vx*dt; luz.y += luz.vy*dt;
      luz.rastro.push({x:luz.x, y:luz.y});
      if (luz.rastro.length > (calmo?6:22)) luz.rastro.shift();

      const dx = luz.x-cx, dy = luz.y-cy, dist = Math.hypot(dx,dy) || 1;

      if (dist + luz.r >= R){
        const ang = Math.atan2(dy,dx);
        const nx = -dx/dist, ny = -dy/dist;
        const perto = Math.abs(dif(ang, arco.ang)) <= arco.meia;

        const dot = luz.vx*nx + luz.vy*ny;
        luz.vx -= 2*dot*nx; luz.vy -= 2*dot*ny;

        if (perto && estado === S.JOGANDO){
          luz.vx += -ny*arco.vel*22; luz.vy += nx*arco.vel*22;
          rebatidas++;
          brilhar(luz.x, luz.y, '#F7C8A0', 10, 130);
          tocar(196 + Math.random()*40, .5, .05, 'sine');
        } else if (estado === S.JOGANDO){
          brilhar(luz.x, luz.y, '#E86A8C', 14, 100);
          tocar(147, .9, .05, 'sine');
        }

        const v = veloc(), m = Math.hypot(luz.vx, luz.vy) || 1;
        luz.vx = luz.vx/m*v; luz.vy = luz.vy/m*v;
        const borda = R - luz.r - 1;
        luz.x = cx + Math.cos(ang)*borda;
        luz.y = cy + Math.sin(ang)*borda;

        if (estado === S.JOGANDO && estrela && estrela.nascendo >= 1){
          estrela.restantes--;
          if (estrela.restantes <= 0) resolver(false);
        }
      }

      if (estrela && estado === S.JOGANDO){
        estrela.giro += dt*0.9;
        estrela.nascendo = Math.min(1, estrela.nascendo + dt*2.4);
        if (Math.hypot(luz.x-estrela.x, luz.y-estrela.y) < luz.r + 15){
          resolver(true);
        }
      }
    }

    for (let i=faiscas.length-1;i>=0;i--){
      const p = faiscas[i];
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx *= 0.95; p.vy *= 0.95;
      p.vida -= dt*0.9;
      if (p.vida <= 0) faiscas.splice(i,1);
    }
  }

  function desenhar(t){
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R*2.1);
    g.addColorStop(0,'#2A1B3D'); g.addColorStop(1,'#1A1028');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    for (const p of poeira){
      ctx.globalAlpha = 0.18 + Math.sin(t*0.001 + p.fase)*0.14;
      ctx.fillStyle = '#F7C8A0';
      ctx.beginPath(); ctx.arc(p.x*W, p.y*H, p.tam, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.lineWidth = 1;
    for (let i=0;i<nos.length;i++){
      const a = nos[i], b = nos[(i+1)%nos.length];
      if (a.aceso && b.aceso){
        ctx.strokeStyle = `rgba(247,200,160,${0.30*Math.min(a.brilho,b.brilho)})`;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      }
    }
    for (const n of nos){
      if (n.aceso){
        const pulso = 1 + Math.sin(t*0.002 + n.x)*0.12;
        ctx.fillStyle = '#FFF4E4';
        ctx.shadowColor = '#E86A8C'; ctx.shadowBlur = 22*n.brilho;
        ctx.beginPath(); ctx.arc(n.x, n.y, 3.2*n.brilho*pulso, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
      } else {
        ctx.fillStyle = 'rgba(155,135,181,.22)';
        ctx.beginPath(); ctx.arc(n.x, n.y, 1.6, 0, Math.PI*2); ctx.fill();
      }
    }

    ctx.strokeStyle = 'rgba(155,135,181,.20)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke();

    if (estrela && estado === S.JOGANDO){
      const s = estrela.nascendo;

      const resta = Math.max(estrela.restantes, 0) / TACADAS;
      ctx.save();
      ctx.globalAlpha = s * (0.22 + (1-resta)*0.4);
      ctx.strokeStyle = '#E86A8C';
      ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(estrela.x, estrela.y, 23, -Math.PI/2, -Math.PI/2 + Math.PI*2*resta);
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.translate(estrela.x, estrela.y); ctx.rotate(estrela.giro);
      ctx.globalAlpha = s;
      ctx.fillStyle = '#F7C8A0';
      ctx.shadowColor = '#F7C8A0'; ctx.shadowBlur = 20;
      ctx.beginPath();
      for (let i=0;i<8;i++){
        const raio = i%2 ? 4*s : 13*s, a = i*Math.PI/4;
        ctx[i?'lineTo':'moveTo'](Math.cos(a)*raio, Math.sin(a)*raio);
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    }

    if (estado !== S.INICIO){
      ctx.lineCap = 'round';
      for (let i=1;i<luz.rastro.length;i++){
        const a = i/luz.rastro.length;
        ctx.strokeStyle = `rgba(232,106,140,${a*0.42})`;
        ctx.lineWidth = a*luz.r*1.5;
        ctx.beginPath();
        ctx.moveTo(luz.rastro[i-1].x, luz.rastro[i-1].y);
        ctx.lineTo(luz.rastro[i].x, luz.rastro[i].y);
        ctx.stroke();
      }
      ctx.fillStyle = '#FFF4E4';
      ctx.shadowColor = '#F7C8A0'; ctx.shadowBlur = 30;
      ctx.beginPath(); ctx.arc(luz.x, luz.y, luz.r, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    if (estado === S.JOGANDO){
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(247,200,160,.16)';
      ctx.lineWidth = 20;
      ctx.beginPath(); ctx.arc(cx, cy, R, arco.ang-arco.meia, arco.ang+arco.meia); ctx.stroke();
      ctx.strokeStyle = '#F7C8A0';
      ctx.lineWidth = 5;
      ctx.shadowColor = '#F7C8A0'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(cx, cy, R, arco.ang-arco.meia, arco.ang+arco.meia); ctx.stroke();
      ctx.shadowBlur = 0;
    }

    for (const p of faiscas){
      ctx.globalAlpha = Math.max(p.vida,0)*0.9;
      ctx.fillStyle = p.cor;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.tam, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  let ultimo = performance.now();
  function quadro(agora){
    const dt = Math.min((agora-ultimo)/1000, 1/30);
    ultimo = agora;
    passo(dt, agora); desenhar(agora);
    requestAnimationFrame(quadro);
  }

  addEventListener('resize', medir);
  medir();
  telaInicial();
  requestAnimationFrame(quadro);
})();
</script>
</body>
</html>
