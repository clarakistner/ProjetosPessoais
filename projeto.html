<html>
<head>
    <title>Presente Misterioso</title>

    <style>

        body {
            background-color: black;
            position: relative;
        }

        h1, p {
            color: azure;
            text-align: center;
        }

        img {
            display: block;
            margin: 50px auto 0 auto;
            height: 500px;
           
        }

       img:hover {
            box-shadow: 0 0 20px 5px #fff; /* sombra branca ao redor */
            transition: box-shadow 0.3s ease; /* efeito suave */
        }

        button {
            display: block;   
            left: 50%;
            top: 80%;
            transform: translateX(-50%); 
            position: absolute;       
            margin: 20px auto;        
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

    </style>
</head>
    <body>
        <h1>Exclusivo para sofiadaputa</h1>
        <p>vamos sair quarta?</p>
        
        <img src="./pica pau.jpg" alt="Imagem de algo">

        <button id = "fugir">SIM</button>

        <script>
        const botao = document.getElementById("fugir");
        let contador = 0;
        const larguraTela = window.innerWidth;
        const alturaTela = window.innerHeight;

        botao.addEventListener("mouseover", () => {
            if(contador < 4){
            const novaPosX = Math.random() * (larguraTela - botao.offsetWidth);
            const novaPosY = Math.random() * (alturaTela - botao.offsetHeight);
            botao.style.left = novaPosX + "px";
            botao.style.top = novaPosY + "px";
            contador++;
            }
        });
        botao.addEventListener("click", () => {
            window.location.href = "https://www.youtube.com/watch?v=3S2jlC80egM&list=RD3S2jlC80egM&start_radio=1"
        });

    </script>
    </body>
</html>
